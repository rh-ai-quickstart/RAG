# yaml-language-server: $schema=quickstart-manifest.schema.json

apiVersion: quickstart.redhat.com/v1
kind: Quickstart

metadata:
  name: rag
  displayName: "Enterprise RAG Chatbot"
  shortDescription: "Centralize company knowledge with a retrieval-augmented generation chatbot powered by LlamaStack and vLLM on OpenShift."
  longDescription: |
    See how FantaCo, a fictional large enterprise, launched a secure RAG chatbot that connects
    employees to internal HR, procurement, sales, and IT documentation. From policies to startup
    guides, employees get fast, accurate answers through a single chat interface. Advanced users
    can extend the experience with AI agents for deeper workflows.

    Retrieval-Augmented Generation (RAG) enhances Large Language Models (LLMs) by retrieving
    relevant external knowledge to improve accuracy, reduce hallucinations, and support
    domain-specific conversations.
  version: "0.2.46"
  repository: "https://github.com/rh-ai-quickstart/RAG"
  maintainer:
    name: "Red Hat AI Quickstarts Team"
    email: "ai-quickstarts@redhat.com"
  license: "MIT"
  lastUpdated: "2026-08-18T00:00:00Z"

versioning:
  installerImageTag: "0.2.46"

classification:
  industries:
    - "Cross-Industry"
    - "Financial Services"
    - "Healthcare"
    - "Retail"
    - "Manufacturing"
  useCases:
    - "Knowledge Management"
    - "Customer Support"
    - "Employee Self-Service"
    - "Document Search"
  aiCapabilities:
    - "Retrieval-Augmented Generation (RAG)"
    - "Large Language Model Inference"
    - "Vector Search / Embeddings"
    - "AI Agents"
    - "Content Safety"
  technologies:
    - name: "LlamaStack"
      role: "AI Orchestration Framework"
      partner: "Meta"
    - name: "vLLM"
      role: "Model Serving"
      partner: "Community"
    - name: "pgvector"
      role: "Vector Database"
      partner: "Community"
    - name: "MinIO"
      role: "Object Storage"
      partner: "Community"
    - name: "Streamlit"
      role: "Frontend UI"
      partner: "Community"
    - name: "Helm"
      role: "Deployment Mechanism"
      partner: "Community"
    - name: "OpenShift"
      role: "Container Platform"
      partner: "Red Hat"
  tags:
    - "rag"
    - "llm"
    - "chatbot"
    - "llamastack"
    - "vllm"
    - "pgvector"
    - "vector-database"
    - "openshift-ai"
    - "enterprise-search"
    - "ai-agents"
    - "content-safety"
  estimatedDeploymentTime: 15

prerequisites:
  openshift:
    minimumVersion: "4.18"
    tested:
      - "4.18"
  operators:
    - name: "OpenShift AI"
      namespace: "cluster"
      required: false
      autoInstalled: false
      installationHint: "Optional. Required for Kubeflow Pipelines batch document ingestion. Install from OperatorHub."
  resources:
    minimum:
      cpu: "8"
      memory: "24Gi"
      storage: "20Gi"
    recommended:
      cpu: "8"
      memory: "32Gi"
      storage: "40Gi"
      gpu:
        count: 1
        memory: "24Gi"
  storageClasses:
    - name: "any-rwo"
      accessModes:
        - "ReadWriteOnce"
      minimumSize: "10Gi"
      usage: "PgVector database and MinIO object storage persistent volumes"
  externalServices:
    - name: "Hugging Face"
      required: false
      purpose: "Model downloads for local LLM deployment"
      configurationHint: "Provide a Hugging Face token (https://huggingface.co/settings/tokens). Not required if using remote LLM endpoints."
    - name: "Tavily API"
      required: false
      purpose: "Web search functionality in the RAG chatbot"
      configurationHint: "Provide a Tavily API key (https://tavily.com/) to enable web search. Optional feature."

deployment:
  supportedActions:
    - "CHECK_PRE_REQS"
    - "STATUS"
    - "INSTALL"
    - "UNINSTALL_DELETE_ALL"
    - "UNINSTALL_KEEP_DATA"
    - "UPGRADE"
  supportedModes:
    - "DEMO"
  installer:
    image: "quay.io/rh-ai-quickstart/rag-installer:0.2.46"
    command: ["/installer/entrypoint.sh"]
    requiredEnv:
      - "TARGET_NAMESPACE"
      - "ACTION"
      - "INSTALL_MODE"
      - "HF_TOKEN"
      - "LLM"
      - "DEVICE"
      - "LLM_TOLERATION"
      - "SAFETY"
      - "SAFETY_TOLERATION"
      - "TAVILY_API_KEY"
      - "LLM_URL"
      - "LLM_API_TOKEN"
      - "LLM_ID"
    rbac:
      serviceAccount:
        name: "rag-installer"
        namespace: "default"
      defaultNamespaceRole:
        name: "rag-installer"
        namespace: "default"
        rules:
          - apiGroups: [""]
            resources: ["pods", "configmaps"]
            verbs: ["get", "list", "watch"]
          - apiGroups: ["batch"]
            resources: ["jobs"]
            verbs: ["get", "list", "watch"]
      defaultNamespaceRoleBinding:
        name: "rag-installer"
        namespace: "default"
        roleRef:
          kind: "Role"
          name: "rag-installer"
        subjects:
          - kind: "ServiceAccount"
            name: "rag-installer"
            namespace: "default"
      clusterRole:
        name: "rag-installer-${TARGET_NAMESPACE}"
        rules:
          - apiGroups: [""]
            resources: ["nodes"]
            verbs: ["get", "list"]
          - apiGroups: ["storage.k8s.io"]
            resources: ["storageclasses"]
            verbs: ["get", "list"]
          - apiGroups: ["config.openshift.io"]
            resources: ["clusterversions"]
            verbs: ["get", "list"]
          - apiGroups: ["apiextensions.k8s.io"]
            resources: ["customresourcedefinitions"]
            verbs: ["get", "list"]
          - apiGroups: ["packages.operators.coreos.com"]
            resources: ["packagemanifests"]
            verbs: ["get", "list"]
          - apiGroups: [""]
            resources: ["namespaces"]
            verbs: ["get", "list", "create", "delete"]
          - apiGroups: [""]
            resources: ["pods", "pods/log", "services", "configmaps", "secrets", "serviceaccounts", "persistentvolumeclaims"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          - apiGroups: ["apps"]
            resources: ["deployments", "statefulsets", "replicasets"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          - apiGroups: ["batch"]
            resources: ["jobs"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          - apiGroups: ["route.openshift.io"]
            resources: ["routes"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          - apiGroups: ["rbac.authorization.k8s.io"]
            resources: ["roles", "rolebindings"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          - apiGroups: ["project.openshift.io"]
            resources: ["projectrequests", "projects"]
            verbs: ["get", "list", "create", "delete"]
      clusterRoleBinding:
        name: "rag-installer-${TARGET_NAMESPACE}"
        roleRef:
          kind: "ClusterRole"
          name: "rag-installer-${TARGET_NAMESPACE}"
        subjects:
          - kind: "ServiceAccount"
            name: "rag-installer"
            namespace: "default"
  defaultNamespace: "llama-stack-rag"
  quickstartResources:
    namespaceScoped:
      - apiGroups: [""]
        resources: ["pods", "services", "secrets", "configmaps", "persistentvolumeclaims", "serviceaccounts"]
        description: "Core application resources (RAG UI, LlamaStack, PgVector, MinIO, model servers)"
      - apiGroups: ["apps"]
        resources: ["deployments", "statefulsets"]
        description: "Application workloads and databases"
      - apiGroups: ["batch"]
        resources: ["jobs"]
        description: "Ingestion pipeline jobs and configuration jobs"
      - apiGroups: ["route.openshift.io"]
        resources: ["routes"]
        description: "RAG UI application route"

parameters:
  secrets:
    - name: "hf-token"
      displayName: "Hugging Face Token"
      description: "Token for downloading LLM models from Hugging Face. Not required if using remote LLM endpoints."
      type: "password"
      required: false
      llmGuidance: "Ask for this unless the user is using a remote LLM endpoint (LLM_URL). Get from https://huggingface.co/settings/tokens. Required for local model deployment."
    - name: "tavily-api-key"
      displayName: "Tavily Search API Key"
      description: "API key for enabling web search functionality in the chatbot."
      type: "password"
      required: false
      llmGuidance: "Optional. Only ask if user mentions web search. Get from https://tavily.com/."
  configuration:
    - name: "llm-model"
      displayName: "LLM Model"
      description: "Which LLM model to deploy (e.g., llama-3-2-3b-instruct, llama-3-1-8b-instruct)."
      type: "string"
      required: true
      llmGuidance: "Ask which model the user wants. Suggest llama-3-2-3b-instruct for single GPU or CPU testing. Suggest llama-3-1-8b-instruct for better quality. The 70B model requires 2x A100 GPUs."
    - name: "device-type"
      displayName: "Device Type"
      description: "Hardware accelerator type: cpu, gpu, hpu (Intel Gaudi), or xeon (Intel Xeon)."
      type: "string"
      required: false
      default: "gpu"
      llmGuidance: "Default is gpu. Ask about available hardware. Use cpu for no-GPU clusters, hpu for Intel Gaudi, xeon for Intel Xeon SPR+ processors (requires min 16 vCPU, 64GB RAM)."
    - name: "safety-model"
      displayName: "Safety Model"
      description: "Optional safety/shield model (e.g., llama-guard-3-8b) for content moderation."
      type: "string"
      required: false
      llmGuidance: "Optional. Only ask if user mentions content safety or moderation. Requires an additional GPU."
    - name: "llm-toleration"
      displayName: "LLM Taint Key"
      description: "Kubernetes taint key for scheduling LLM pods on GPU/HPU nodes (e.g., nvidia.com/gpu)."
      type: "string"
      required: false
      llmGuidance: "Only needed if GPU/HPU nodes are tainted. Common values: nvidia.com/gpu for NVIDIA, habana.ai/gaudi for Intel Gaudi. Auto-detected if not provided."

access:
  endpoints:
    - name: "rag-ui"
      displayName: "RAG Chatbot UI"
      type: "route"
      path: "/"
      description: "Streamlit-based chat interface for querying enterprise documents"
      public: true
      authentication: "none"

cleanup:
  dataDescription: |
    PgVector database with vector embeddings, MinIO object storage with uploaded documents.
  warning: |
    Uninstalling with delete-all will permanently remove all ingested documents and vector
    embeddings. Use uninstall-keep-data to preserve PVCs for re-installation.

documentation:
  readme: "https://github.com/rh-ai-quickstart/RAG/blob/main/README.md"
  installGuide: "https://github.com/rh-ai-quickstart/RAG/blob/main/docs/openshift_setup_guide.md"
  localSetupGuide: "https://github.com/rh-ai-quickstart/RAG/blob/main/docs/local_setup_guide.md"

llmContext:
  whenToRecommend: |
    Recommend when users want to build an enterprise knowledge base, internal chatbot, or
    document Q&A system. Ideal for teams looking to centralize company documentation (HR
    policies, procurement guides, sales playbooks, IT support) into a searchable AI-powered
    assistant. Also appropriate when users ask about RAG patterns, vector databases, or
    LlamaStack on OpenShift.
  faq:
    - question: "What GPU do I need?"
      answer: "A single NVIDIA GPU with 24GB VRAM (e.g., L4) is sufficient for the 3B model. The 70B model requires 2x A100 GPUs. CPU and Intel Xeon deployments are also supported without any GPU."
    - question: "Can I use a remote LLM instead of deploying one locally?"
      answer: "Yes, set LLM=remotellm with LLM_URL and LLM_API_TOKEN to point to any OpenAI-compatible endpoint. No GPU or HF token is needed for remote models."
    - question: "How do I ingest my own documents?"
      answer: "Upload documents directly through the RAG UI chat interface, or use the Kubeflow pipeline integration for batch ingestion from S3/MinIO."
    - question: "What models are supported?"
      answer: "Llama 3.2 (1B, 3B), Llama 3.1 (8B), Llama 3.3 (70B), Llama Guard (1B, 8B), Granite Vision, and Qwen VL models. Custom models can be added via the values file."
    - question: "Can I run this without a GPU?"
      answer: "Yes, use DEVICE=cpu or DEVICE=xeon. Xeon mode is optimized for Intel Sapphire Rapids+ processors and requires minimum 16 vCPU and 64GB RAM."
