# E2E test values with MaaS (Model-as-a-Service) integration
# This extends values-e2e.yaml with MaaS inference capability
# Enables full e2e testing including chat completions and RAG queries

replicaCount: 1

image:
  repository: quay.io/rh-ai-quickstart/llamastack-dist-ui
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8501

serviceAccount:
  create: false

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

env:
  - name: LLAMA_STACK_ENDPOINT
    value: 'http://llamastack:8321'

volumes:
  - emptyDir: {}
    name: dot-streamlit

volumeMounts:
  - mountPath: /.streamlit
    name: dot-streamlit

# Configure models to use Red Hat MaaS
# All MaaS configuration (url, id, enabled, apiToken) will be injected via helm --set in GitHub Actions
# The workflow patches out wait-for-models init after install (subchart ignores skipModelWait here)
global:
  models: {}

# PostgreSQL + PGVector configuration
pgvector:
  enabled: true
  secret:
    user: postgres
    password: test_password
    dbname: rag_test_db
    host: pgvector
    port: "5432"
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  # Default chart PVC is 5Gi — too heavy for Kind on GHA runners
  volumeClaimTemplates:
    - metadata:
        name: pg-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

# Llama Stack configuration for MaaS (ogxai/distribution-starter via llama-stack 0.8.x)
llama-stack:
  enabled: true
  secrets:
    TAVILY_SEARCH_API_KEY: ""

  initContainers: []
  skipModelWait: true

  # OGX starter needs more headroom than the old llamastack image in Kind CI
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1"

  readinessProbe:
    httpGet:
      path: /v1/health
      port: 8321
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 10

  livenessProbe:
    httpGet:
      path: /v1/health
      port: 8321
    initialDelaySeconds: 120
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 10

  # Avoid llama-stack-data PVC (2Gi RWO) — use emptyDir in Kind CI
  volumes:
    - configMap:
        defaultMode: 420
        name: run-config
      name: run-config-volume
    - emptyDir: {}
      name: dot-llama
    - emptyDir: {}
      name: cache

  fileProcessors:
    enabled: true
    providers:
      - provider_id: pypdf
        provider_type: inline::pypdf

# Disable components that require OpenShift/KServe CRDs
llm-service:
  enabled: false

configure-pipeline:
  enabled: false
  persistence:
    enabled: false
  pvc:
    create: false

# MCP servers
mcp-servers:
  enabled: false

# Data ingestion pipeline - Disabled for Kind (requires OpenShift internal registry)
# The ingestion pipeline uses OpenShift-specific images that aren't available in Kind
# For full RAG testing, this would need to be enabled in an OpenShift environment
ingestion-pipeline:
  enabled: false
  replicaCount: 0
  defaultPipeline:
    enabled: false

